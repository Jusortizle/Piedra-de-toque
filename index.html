<html lang="es">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Herramienta de campo: grafito neutro, un solo acento azul (azurita) y cinco colores semánticos para los niveles de interés. */
:root {
  --bg: #ECEEEF; --surf: #F8F9F9; --surf2: #E1E5E7; --ink: #14181B; --mut: #58636B; --line: #CBD2D6;
  --acc: #1D4FB8; --acc-ink: #FFFFFF; --ok: #1E7A46; --warn: #9A5B00;
  --c0: #5B666E; --c1: #0C7C78; --c2: #A8660B; --c3: #6C45C4; --c4: #B93428;
  --f-disp: 'Barlow Semi Condensed', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1013; --surf: #151A1E; --surf2: #1D2328; --ink: #E6EAED; --mut: #8E9AA3; --line: #283037;
    --acc: #86A9FF; --acc-ink: #08101F; --ok: #5BD08A; --warn: #E9B24D;
    --c0: #96A2AB; --c1: #46CBC3; --c2: #E9B24D; --c3: #B9A0FF; --c4: #FF8173; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1013; --surf: #151A1E; --surf2: #1D2328; --ink: #E6EAED; --mut: #8E9AA3; --line: #283037;
  --acc: #86A9FF; --acc-ink: #08101F; --ok: #5BD08A; --warn: #E9B24D;
  --c0: #96A2AB; --c1: #46CBC3; --c2: #E9B24D; --c3: #B9A0FF; --c4: #FF8173; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0 0 .6em; }
ul, ol { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
[hidden] { display: none !important; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar h1 { flex: 1; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .08em; }
.ib { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surf); border-radius: 10px; font-size: 1.25rem; line-height: 1; cursor: pointer; }
.vista { max-width: 640px; margin: 0 auto; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
.vista > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surf); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--mut); font: 600 .72rem/1.1 var(--f-disp); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; border-radius: 10px; }
.tabs button.on { color: var(--acc); }

.card { background: var(--surf); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; min-width: 0; }
.card > h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); margin-bottom: 10px; }
.card > * + * { margin-top: 10px; }
.card > h3 + * { margin-top: 0; }
.nivel { border-width: 1px 1px 1px 1px; }
.nivel.c0 { border-color: var(--c0); } .nivel.c1 { border-color: var(--c1); } .nivel.c2 { border-color: var(--c2); } .nivel.c3 { border-color: var(--c3); } .nivel.c4 { border-color: var(--c4); }
.nd { font-size: 1.05rem; }
.mut { color: var(--mut); } .peq { font-size: .85rem; } .nota { color: var(--mut); font-size: .9rem; }
.ayuda { color: var(--mut); font-size: .9rem; }
.aviso { color: var(--warn); font-size: .92rem; }
.big { font: 600 1.7rem/1 var(--f-disp); }
.datos { font-family: var(--f-mono); font-size: .85rem; }

.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 700 .78rem/1.3 var(--f-disp); letter-spacing: .1em; border: 1px solid currentColor; white-space: nowrap; }
.pill.c0 { color: var(--c0); } .pill.c1 { color: var(--c1); } .pill.c2 { color: var(--c2); } .pill.c3 { color: var(--c3); } .pill.c4 { color: var(--c4); }
.pill.vac { opacity: .7; }
.pill.ban.alta { color: var(--ok); } .pill.ban.media { color: var(--warn); } .pill.ban.baja { color: var(--c4); }
.tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; font: 600 .66rem/1.5 var(--f-disp); letter-spacing: .1em; color: var(--mut); vertical-align: middle; }
.tag.acc { color: var(--acc); border-color: var(--acc); } .tag.ej { color: var(--c2); border-color: var(--c2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surf2); font-weight: 600; cursor: pointer; }
.btn.pri { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.btn.peq { min-height: 36px; padding: 0 12px; font-size: .9rem; }
.btn.ancho { width: 100%; }
.btn.peligro { color: var(--c4); border-color: var(--c4); background: transparent; }
.enlace { border: 0; background: none; color: var(--acc); text-decoration: underline; cursor: pointer; padding: 0 0 0 6px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.fila { gap: 6px; }
.chip { min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surf); cursor: pointer; text-align: left; line-height: 1.25; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.chip.ia { border-style: dashed; }
.chip .tag { color: inherit; border-color: currentColor; font-style: normal; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surf2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { min-height: 40px; border: 0; border-radius: 8px; background: none; font: 600 .85rem var(--f-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); cursor: pointer; }
.seg button.on { background: var(--surf); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cod { font: 500 .85rem var(--f-mono); color: var(--mut); }

.resumen { display: flex; gap: 24px; align-items: baseline; color: var(--mut); }
.resumen .big { color: var(--ink); }
.buscar input, .ctl { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
textarea.ctl { min-height: 96px; resize: vertical; }
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo > span { font: 600 .78rem var(--f-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }

.lista { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px; width: 100%; text-align: left; background: var(--surf); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; position: relative; }
.item .thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--surf2); display: grid; place-items: center; color: var(--mut); }
.item img, .miniaturas img { width: 100%; height: 100%; object-fit: cover; }
.itxt { display: flex; flex-direction: column; min-width: 0; }
.ititle { font-weight: 600; overflow-wrap: anywhere; }
.isub { color: var(--mut); font-size: .82rem; }
.estrella { position: absolute; top: 6px; right: 8px; color: var(--c2); font-size: .9rem; }
.vacio { text-align: center; padding: 32px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.vacio h2 { font-size: 1.4rem; } .vacio p { color: var(--mut); max-width: 44ch; }
.pasos { list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 8px; }
.pasos li { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }
.pasos b { font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .06em; color: var(--acc); }
.pasos span { color: var(--mut); font-size: .92rem; }

.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px; background: var(--surf); border: 1px solid var(--line); border-radius: 10px; }
.slot.hecha { border-color: var(--ok); }
.slotimg { aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surf2); display: grid; place-items: center; font-size: 1.6rem; color: var(--mut); }
.slotimg img { width: 100%; height: 100%; object-fit: cover; }
.slottxt { min-width: 0; } .slottxt p { font-size: .88rem; color: var(--mut); margin: 2px 0 8px; }
.slottxt .cal.ok { color: var(--ok); } .slottxt .cal.aviso { color: var(--warn); }
.miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.miniaturas img { aspect-ratio: 1; border-radius: 8px; }
.ph { color: var(--mut); }

.ranking { display: flex; flex-direction: column; gap: 6px; }
.cand { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.cand.otro { border-style: dashed; }
.cand summary { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 10px; cursor: pointer; list-style: none; }
.cand summary::-webkit-details-marker { display: none; }
.cn { font-weight: 600; overflow-wrap: anywhere; } .cp { font: 500 .95rem var(--f-mono); text-align: right; display: flex; gap: 6px; justify-content: flex-end; align-items: baseline; }
.barra { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surf2); overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.cand.otro .barra span { background: var(--mut); }
.delta { font-style: normal; font-size: .75rem; }
.delta.sube { color: var(--ok); } .delta.baja { color: var(--c4); }
.det { padding: 0 10px 10px; font-size: .92rem; }

.evids { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.evid { border-top: 3px solid var(--line); padding-top: 6px; min-width: 0; }
.evid h4 { font-size: .8rem; letter-spacing: .12em; margin-bottom: 4px; }
.evid.obs { border-color: var(--ok); } .evid.inf { border-color: var(--acc); } .evid.nd { border-color: var(--mut); }
.evid ul { list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: .9rem; } .evid li { overflow-wrap: anywhere; }

.prueba { display: flex; flex-direction: column; gap: 8px; }
.prueba header { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.prueba h4 { font-size: 1.15rem; }
.porque { font-size: .9rem; }
.opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opciones.col { grid-template-columns: 1fr; }
.op { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: left; cursor: pointer; min-height: 48px; }
.op:hover { border-color: var(--acc); }
.opprev { font: 500 .78rem var(--f-mono); color: var(--mut); }
.plegable { border-top: 1px solid var(--line); padding: 8px 0; }
.plegable summary { cursor: pointer; font-weight: 600; }
.plegable > * + * { margin-top: 8px; }
.calc { display: flex; flex-direction: column; gap: 10px; }
.resultado { margin-top: 8px; }
.seg-it { padding-left: 10px; border-left: 3px solid var(--warn); }
.ejes { display: flex; flex-direction: column; gap: 12px; }
.ejes h4, .razones + h4 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin-bottom: 2px; }
.razones, .reg { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.reg li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lista-min { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 9; max-width: 600px; margin: 0 auto; padding: 12px 14px; background: var(--ink); color: var(--bg); border-radius: 10px; font-size: .92rem; }
@media (prefers-reduced-motion: no-preference) { .barra span { transition: width .35s ease; } }
</style>
</head>

<script>

/* ---------- Preparación de la base ---------- */

const MAG_ORD = ['ninguno', 'debil', 'fuerte'];
const ORDINALES = { mag: MAG_ORD, fizz: MAG_ORD };
const CAMPO = { brillo: 'br', color: 'co', raya: 'ra', transp: 'tr', habito: 'ha', mag: 'mg', fizz: 'fz', mal: 'ml' };
const DEFECTO = { mg: 'ninguno', fz: 'ninguno', ml: 'quebradizo' };
const PISO = { brillo: 0.06, color: 0.12, transp: 0.08, habito: 0.06, mag: 0.02, raya: 0.04, fizz: 0.04, mal: 0.05 };
const PESO = { brillo: 0.8, color: 0.55, transp: 0.7, habito: 0.65, mag: 1, raya: 1, fizz: 1, mal: 1, dureza: 1, densidad: 1, rasgo: 0.8 };
const OTRO_FRACCION = 0.12;
const OTRO_ESCALA = 0.8;
const OTRO_PISO = 0.03;

function tokens(s) {
  const main = [], alt = [];
  (s || '').split(/\s+/).filter(Boolean).forEach(t => (t.endsWith('~') ? alt.push(t.slice(0, -1)) : main.push(t)));
  return { main, alt };
}

function preparar(m) {
  const tk = {};
  for (const k of Object.keys(CAMPO)) tk[k] = tokens(m[CAMPO[k]] || DEFECTO[CAMPO[k]]);
  return Object.assign({}, m, {
    t: m.t || 'm', tk, rgset: new Set((m.rg || '').split(/\s+/).filter(Boolean)),
    eco: (m.eco || '').split(/\s+/).filter(Boolean), pel: (m.pel || '').split(/\s+/).filter(Boolean),
    col: m.col || 0, ind: m.ind || 0, na: m.na || 0
  });
}

const BASE = MINERALES.map(preparar);
const PRIOR_TOTAL = BASE.reduce((s, m) => s + m.p, 0);
const OTRO = { id: 'otro', n: 'Otro / no está en la base', p: PRIOR_TOTAL * OTRO_FRACCION / (1 - OTRO_FRACCION), eco: [], pel: [], rgset: new Set(), col: 0, ind: 0, na: 0, t: 'o' };

function porId(id) { return id === 'otro' ? OTRO : BASE.find(m => m.id === id); }

/* ---------- Verosimilitud ---------- */

function lCat(k, tk, v) {
  if (tk.main.includes(v)) return 0.9;
  if (tk.alt.includes(v)) return 0.3;
  let l = PISO[k];
  const ord = ORDINALES[k];
  if (ord) {
    const i = ord.indexOf(v);
    if (tk.main.some(x => Math.abs(ord.indexOf(x) - i) === 1)) l = Math.max(l, 0.2);
  }
  return l;
}

function lRango(obs, ref, esc, piso) {
  const lo = Math.max(obs[0], ref[0]), hi = Math.min(obs[1], ref[1]);
  if (hi >= lo) {
    const wmin = Math.min(obs[1] - obs[0], ref[1] - ref[0]);
    const f = wmin <= 1e-9 ? 1 : Math.min(1, (hi - lo) / wmin);
    return piso + (0.95 - piso) * f;
  }
  return Math.max(piso * 0.1, piso * Math.exp(-(lo - hi) / esc));
}

function lDensidad(obs, ref) {
  const mid = (ref[0] + ref[1]) / 2;
  return lRango(obs, ref, Math.max(0.15, 0.04 * mid), 0.02);
}

const cacheOtro = new Map();

/* «Otro» se comporta como un mineral típico de la base: su verosimilitud es el promedio ponderado por frecuencia. */
function lOtro(k, v) {
  const clave = k + '|' + JSON.stringify(v);
  if (!cacheOtro.has(clave)) {
    let s = 0;
    for (const m of BASE) s += m.p * verosimilitud(m, k, v);
    cacheOtro.set(clave, Math.max(OTRO_PISO, OTRO_ESCALA * s / PRIOR_TOTAL));
  }
  return cacheOtro.get(clave);
}

/* Verosimilitud de una observación (kind, valor) bajo un candidato. */
function verosimilitud(m, k, v) {
  if (m.id === 'otro') return lOtro(k, v);
  if (k === 'dureza') return lRango(v, m.h, 1, 0.03);
  if (k === 'densidad') return lDensidad(v, m.d);
  if (k === 'rasgo') return m.rgset.has(v) ? 0.8 : 0.1;
  return lCat(k, m.tk[k], v);
}

function agrupar(obs) {
  const g = {};
  for (const o of obs) (g[o.k] = g[o.k] || []).push(o);
  return g;
}

/* Verosimilitud conjunta de las observaciones agrupadas para un candidato (en logaritmo). */
function logVerosimilitud(m, grupos) {
  let lp = 0;
  for (const k of Object.keys(grupos)) {
    const lst = grupos[k];
    const w = PESO[k] * (lst.every(o => o.src === 'ia') ? 0.5 : 1);
    if (k === 'rasgo') {
      for (const o of lst) lp += w * Math.log(verosimilitud(m, k, o.v));
    } else if (k === 'dureza' || k === 'densidad' || k === 'mag' || k === 'raya' || k === 'fizz' || k === 'mal') {
      const o = lst[lst.length - 1];
      lp += w * Math.log(verosimilitud(m, k, o.v));
    } else {
      lp += w * Math.log(Math.max(...lst.map(o => verosimilitud(m, k, o.v))));
    }
  }
  return lp;
}

function normalizar(items) {
  const mx = Math.max(...items.map(x => x.lp));
  let s = 0;
  for (const x of items) { x.p = Math.exp(x.lp - mx); s += x.p; }
  for (const x of items) x.p /= s;
  return items.sort((a, b) => b.p - a.p);
}

/* Reparto de probabilidad relativa entre candidatos. Incluye siempre «Otro». */
function calcular(obs) {
  const grupos = agrupar(obs);
  const items = BASE.concat([OTRO]).map(m => ({ id: m.id, m, lp: Math.log(m.p) + logVerosimilitud(m, grupos) }));
  return normalizar(items);
}

function entropia(items) {
  let h = 0;
  for (const x of items) if (x.p > 0) h -= x.p * Math.log2(x.p);
  return h;
}

/* ---------- Confianza ---------- */

function contarFisicas(obs) {
  return new Set(obs.filter(o => KIND_FISICO.includes(o.k) && o.src !== 'ia').map(o => o.k)).size;
}

function banda(post, obs) {
  const top = post[0];
  const T = contarFisicas(obs);
  const segundo = post[1] ? post[1].p : 0;
  const razon = segundo > 0 ? top.p / segundo : Infinity;
  if (top.id === 'otro') return { nivel: 'baja', T, motivo: 'La opción más probable es «otro»: lo observado no encaja bien con la base.' };
  if (T === 0) return { nivel: 'baja', T, motivo: 'Solo hay observación visual; con eso la confianza no puede pasar de baja.' };
  if (T >= 2 && top.p >= 0.75 && razon >= 3) return { nivel: 'alta', T, motivo: 'Dos o más pruebas físicas independientes apuntan al mismo candidato.' };
  if (top.p >= 0.4) return { nivel: 'media', T, motivo: T >= 2 ? 'Hay evidencia física, pero queda otro candidato cercano.' : 'Hay una prueba física; faltan más para separar candidatos.' };
  return { nivel: 'baja', T, motivo: 'Los candidatos principales siguen muy parejos.' };
}

/* ---------- Interés, mercado y seguridad ---------- */

function suma(post, fn) { return post.reduce((s, x) => (x.id !== 'otro' && fn(x.m) ? s + x.p : s), 0); }

function evaluar(post, obs, opts) {
  const T = contarFisicas(obs);
  const otro = post.find(x => x.id === 'otro').p;
  const naMasa = suma(post, m => m.na === 1);
  const geoPuntaje = suma(post, m => m.ind === 2) + 0.35 * suma(post, m => m.ind === 1);
  const ecoMasa = suma(post, m => m.eco.length > 0 && (m.ind === 2 || m.eco.some(c => c !== 'mena')));
  const colMasa = suma(post, m => m.col === 1);
  const noAlterar = !!(opts && opts.noAlterarManual) || naMasa >= (T >= 1 ? 0.25 : 0.4);
  const geo = geoPuntaje >= 0.25 && T >= 1 ? 'alto' : geoPuntaje >= 0.12 ? 'medio' : 'bajo';
  const eco = ecoMasa >= 0.3 && T >= 1;
  const interesante = colMasa >= 0.3 || geo !== 'bajo' || naMasa >= 0.05 || (otro >= 0.35 && T >= 2);
  let nivel = 'comun';
  if (noAlterar) nivel = 'noalterar';
  else if (geo === 'alto') nivel = 'geo';
  else if (eco) nivel = 'eco';
  else if (interesante) nivel = 'interesante';
  return { nivel, noAlterar, geo, eco, interesante, T, naMasa, geoPuntaje, ecoMasa, colMasa, otro };
}

const RAZON_TEXTO = {
  gema: 'posible gema', mena: 'posible mena metálica', esp: 'posible espécimen de colección',
  orn: 'posible roca ornamental', ind: 'puede indicar mineralización o un proceso geológico',
  na: 'ejemplar delicado o raro: conviene no alterarlo', col: 'interés de coleccionismo'
};

/* Razones por las que sería un error botar la muestra, con los candidatos que las motivan. */
function razones(post) {
  const out = [];
  for (const x of post) {
    if (x.id === 'otro' || x.p < 0.04) continue;
    const m = x.m, r = [];
    if (m.eco.includes('gema')) r.push(RAZON_TEXTO.gema);
    if (m.eco.includes('mena')) r.push(RAZON_TEXTO.mena);
    if (m.eco.includes('esp')) r.push(RAZON_TEXTO.esp);
    if (m.eco.includes('orn')) r.push(RAZON_TEXTO.orn);
    if (m.ind === 2) r.push(RAZON_TEXTO.ind);
    if (m.na) r.push(RAZON_TEXTO.na);
    if (!r.length && m.col) r.push(RAZON_TEXTO.col);
    if (r.length) out.push({ id: m.id, nombre: m.n, p: x.p, motivos: r });
  }
  return out.slice(0, 5);
}

function mercado(post, obs) {
  const T = contarFisicas(obs);
  const clases = {};
  for (const x of post) if (x.id !== 'otro') for (const c of x.m.eco) if (MERCADO[c]) clases[c] = (clases[c] || 0) + x.p;
  const orden = Object.keys(clases).filter(c => clases[c] >= 0.05).sort((a, b) => clases[b] - clases[a]);
  return { T, estimable: T >= 1 && orden.length > 0, clases: orden.map(c => ({ id: c, masa: clases[c], nombre: MERCADO[c].nombre, factores: MERCADO[c].factores })) };
}

function seguridad(post, obs) {
  const tags = new Set();
  for (const x of post) if (x.id !== 'otro' && x.p >= 0.08) x.m.pel.forEach(t => tags.add(t));
  const fibroso = obs.some(o => o.k === 'habito' && o.v === 'fibroso');
  if (fibroso) tags.add('asbesto');
  const otro = post.find(x => x.id === 'otro');
  if (otro && otro.p >= 0.3) tags.add('desconocida');
  return [...tags].map(t => ({ tag: t, texto: PELIGROS[t] }));
}

/* ---------- Pruebas recomendadas ---------- */

const PRUEBAS = {
  mag: { nombre: 'Imán', equipo: ['iman'], costo: 0.1, destructivo: false },
  densidad: { nombre: 'Densidad', equipo: ['bascula'], costo: 0.6, destructivo: false },
  raya: { nombre: 'Raya en porcelana', equipo: ['porcelana'], costo: 0.25, destructivo: true },
  fizz: { nombre: 'Gota de vinagre', equipo: ['vinagre'], costo: 0.3, destructivo: true },
  dureza: { nombre: 'Dureza (rayado)', equipo: ['moneda', 'cuchillo', 'vidrio'], cualquiera: true, costo: 0.5, destructivo: true },
  mal: { nombre: 'Maleabilidad', equipo: ['cuchillo'], costo: 0.5, destructivo: true }
};

function resultadosPosibles(k) {
  if (k === 'dureza') return DUREZA_OPCIONES.map(o => ({ v: o.rango, etiqueta: o.texto, id: o.id }));
  if (k === 'densidad') return DENSIDAD_BINS.map(b => ({ v: b, etiqueta: b[0] + '–' + b[1] + ' g/cm³' }));
  return Object.keys(VOC[k]).map(v => ({ v, etiqueta: VOC[k][v] }));
}

function equipoDisponible(k, kit) {
  const def = PRUEBAS[k];
  if (!def) return true;
  return def.cualquiera ? def.equipo.some(e => kit[e]) : def.equipo.every(e => kit[e]);
}

function describirDiferencia(k, a, b) {
  const texto = m => {
    if (k === 'dureza') return 'dureza ' + m.h.join('–');
    if (k === 'densidad') return 'densidad ' + m.d.join('–');
    return (m.tk[k].main.map(v => VOC[k][v]).join(' o ') || '—').toLowerCase();
  };
  return a.n + ': ' + texto(a) + '. ' + b.n + ': ' + texto(b) + '.';
}

/* Ordena las pruebas por ganancia esperada de información dividida por su costo. */
function sugerirPruebas(obs, kit, opts) {
  const post = calcular(obs);
  const h0 = entropia(post);
  const hechas = new Set(obs.map(o => o.k));
  const bloqueadas = opts && opts.noAlterar;
  const candidatos = Object.keys(PRUEBAS).concat(KIND_VISUAL).filter(k => !hechas.has(k));
  const res = [];
  for (const k of candidatos) {
    const def = PRUEBAS[k];
    const disponible = equipoDisponible(k, kit);
    const oculta = !!(def && def.destructivo && bloqueadas);
    const salidas = resultadosPosibles(k);
    const L = post.map(x => salidas.map(s => Math.pow(verosimilitud(x.m, k, s.v), PESO[k])));
    const Ln = L.map(fila => { const t = fila.reduce((a, b) => a + b, 0); return fila.map(v => v / t); });
    let hEsp = 0;
    const detalle = salidas.map((s, j) => {
      let pj = 0;
      post.forEach((x, i) => { pj += x.p * Ln[i][j]; });
      const nuevo = post.map((x, i) => ({ id: x.id, m: x.m, p: pj > 0 ? x.p * Ln[i][j] / pj : 0 }));
      nuevo.sort((a, b) => b.p - a.p);
      hEsp += pj * entropia(nuevo);
      return { v: s.v, etiqueta: s.etiqueta, id: s.id, prob: pj, top: { id: nuevo[0].id, nombre: nuevo[0].m.n, p: nuevo[0].p } };
    });
    const ganancia = Math.max(0, h0 - hEsp);
    const costo = def ? def.costo : 0.2;
    const top = post.filter(x => x.id !== 'otro').slice(0, 2);
    res.push({
      k, nombre: KIND_NAMES[k], ganancia, costo, puntaje: ganancia / (0.4 + costo),
      destructivo: !!(def && def.destructivo), visual: !def, disponible, oculta, salidas: detalle,
      porque: top.length === 2 ? describirDiferencia(k, top[0].m, top[1].m) : ''
    });
  }
  return res.sort((a, b) => b.puntaje - a.puntaje);
}

/* ---------- Densidad ---------- */

/* Peso en aire y lectura al sumergir la muestra colgada de un hilo en un vaso con agua tarado. */
function densidadSumergida(aire, lectura, res) {
  if (!(aire > 0) || !(lectura > 0)) return null;
  const r = res || 0;
  const lo = (aire - r) / (lectura + r);
  const hi = lectura - r > 0 ? (aire + r) / (lectura - r) : Infinity;
  return { valor: aire / lectura, lo, hi: Math.min(hi, 30) };
}

function densidadDesplazamiento(masa, v1, v2, resV) {
  const v = v2 - v1;
  if (!(masa > 0) || !(v > 0)) return null;
  const r = resV || 0;
  const hi = v - r > 0 ? masa / (v - r) : Infinity;
  return { valor: masa / v, lo: masa / (v + r), hi: Math.min(hi, 30) };
}

/* ---------- Calidad de fotografía ---------- */

function nitidez(gris, w, h) {
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const l = 4 * gris[i] - gris[i - 1] - gris[i + 1] - gris[i - w] - gris[i + w];
      s += l; s2 += l * l; n++;
    }
  }
  return n ? s2 / n - (s / n) * (s / n) : 0;
}

function exposicion(gris) {
  let suma_ = 0, osc = 0, que = 0;
  for (let i = 0; i < gris.length; i++) {
    const g = gris[i];
    suma_ += g;
    if (g < 25) osc++;
    if (g > 240) que++;
  }
  const n = gris.length || 1;
  return { media: suma_ / n, oscuro: osc / n, quemado: que / n };
}

function juzgarFoto(nit, exp) {
  const enfoque = nit >= 150 ? 'bueno' : nit >= 40 ? 'regular' : 'pobre';
  const luz = exp.media < 55 || exp.oscuro > 0.5 ? 'oscura' : exp.quemado > 0.25 ? 'quemada' : 'ok';
  return { enfoque, luz, nitidez: Math.round(nit) };
}

/* ---------- Almacenamiento local (IndexedDB con respaldo en memoria) ---------- */

const Almacen = (() => {
  let db = null, enMemoria = false;
  const mem = { muestras: new Map(), fotos: new Map(), meta: new Map() };
  const seq = { muestras: 0, fotos: 0 };
  const req = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  const clave = (s, v) => (s === 'meta' ? v.k : v.id);

  function abrir() {
    return new Promise(ok => {
      try {
        const r = indexedDB.open('rocas', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('muestras', { keyPath: 'id', autoIncrement: true });
          d.createObjectStore('fotos', { keyPath: 'id', autoIncrement: true }).createIndex('muestra', 'muestra');
          d.createObjectStore('meta', { keyPath: 'k' });
        };
        r.onsuccess = () => { db = r.result; ok(true); };
        r.onerror = () => { enMemoria = true; ok(false); };
        r.onblocked = () => { enMemoria = true; ok(false); };
      } catch (e) { enMemoria = true; ok(false); }
    });
  }

  return {
    abrir,
    get enMemoria() { return enMemoria; },
    async listar(s) { return enMemoria ? [...mem[s].values()] : req(db.transaction(s).objectStore(s).getAll()); },
    async leer(s, k) { return enMemoria ? mem[s].get(k) : req(db.transaction(s).objectStore(s).get(k)); },
    async guardar(s, v) {
      if (enMemoria) {
        if (s !== 'meta' && v.id == null) v.id = ++seq[s];
        mem[s].set(clave(s, v), v);
        return clave(s, v);
      }
      const k = await req(db.transaction(s, 'readwrite').objectStore(s).put(v));
      if (s !== 'meta' && v.id == null) v.id = k;
      return k;
    },
    async borrar(s, k) { if (enMemoria) mem[s].delete(k); else await req(db.transaction(s, 'readwrite').objectStore(s).delete(k)); },
    async fotosDe(id) {
      if (enMemoria) return [...mem.fotos.values()].filter(f => f.muestra === id);
      return req(db.transaction('fotos').objectStore('fotos').index('muestra').getAll(id));
    },
    async vaciar() {
      for (const s of ['muestras', 'fotos', 'meta']) {
        if (enMemoria) mem[s].clear(); else await req(db.transaction(s, 'readwrite').objectStore(s).clear());
      }
    }
  };
})();

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

const corto = s => String(s).split(' (')[0];
const num = (n, d = 2) => Number(n).toLocaleString('es', { maximumFractionDigits: d });
const pct = p => (p < 0.005 ? '<1' : String(Math.round(p * 100)));

const TOAST_MS = 3200;

function pintarToast() {
  const t = document.getElementById('toast');
  const resta = TOAST_MS - (Date.now() - S.msgTs);
  if (!t || !S.msg || resta <= 0) return;
  t.textContent = S.msg; t.hidden = false;
  clearTimeout(pintarToast.t);
  pintarToast.t = setTimeout(() => { t.hidden = true; }, resta);
}

function toast(texto) {
  S.msg = texto; S.msgTs = Date.now();
  pintarToast();
}

/* ---------- Análisis de una muestra ---------- */

function analisis(m) {
  const post = calcular(m.obs);
  const opts = { noAlterarManual: m.noAlterar };
  const nivel = evaluar(post, m.obs, opts);
  return { post, nivel, banda: banda(post, m.obs), seg: seguridad(post, m.obs), raz: razones(post), mer: mercado(post, m.obs) };
}

function nombreMuestra(m) {
  if (m.nombre) return m.nombre;
  if (m.idFinal) return m.idFinal.nombre;
  if (m.obs.length) { const t = calcular(m.obs)[0]; return t.id === 'otro' ? 'Sin identificar' : t.m.n; }
  return 'Sin analizar';
}

function etiquetaObs(o) {
  if (o.l) return o.l;
  if (o.k === 'rasgo') return VOC.rasgo[o.v];
  if (o.k === 'mag') return 'Magnetismo: ' + VOC.mag[o.v].toLowerCase();
  if (o.k === 'raya') return 'Raya: ' + corto(VOC.raya[o.v]).toLowerCase();
  if (o.k === 'fizz') return 'Vinagre: ' + VOC.fizz[o.v].toLowerCase();
  if (o.k === 'mal') return corto(VOC.mal[o.v]);
  return KIND_NAMES[o.k] + ': ' + corto(VOC[o.k][o.v]).toLowerCase();
}

function cambiar(m, fn) {
  m.obsPrev = m.obs.map(o => Object.assign({}, o));
  fn();
  return guardarMuestra(m).then(render);
}

function alternarObs(m, k, v) {
  cambiar(m, () => {
    const i = m.obs.findIndex(o => o.k === k && o.v === v);
    if (i < 0) m.obs.push({ k, v, src: 'usuario' });
    else if (m.obs[i].src === 'ia') m.obs[i].src = 'usuario';
    else m.obs.splice(i, 1);
  });
}

function registrar(m, k, v, etiqueta) {
  cambiar(m, () => {
    m.obs = m.obs.filter(o => o.k !== k);
    m.obs.push({ k, v, src: 'usuario', l: etiqueta, t: Date.now() });
  });
}

/* ---------- Pestaña: fotos ---------- */

function leerImagen(file) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); ok(i); };
    i.onerror = () => { URL.revokeObjectURL(u); ko(new Error('No se pudo leer la imagen')); };
    i.src = u;
  });
}

async function prepararFoto(file) {
  const img = await leerImagen(file);
  const esc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * esc)), hh = Math.max(1, Math.round(img.naturalHeight * esc));
  const c = document.createElement('canvas');
  c.width = w; c.height = hh;
  c.getContext('2d').drawImage(img, 0, 0, w, hh);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  const sw = 256, sh = Math.max(3, Math.round(hh * sw / w));
  const c2 = document.createElement('canvas');
  c2.width = sw; c2.height = sh;
  const x2 = c2.getContext('2d');
  x2.drawImage(c, 0, 0, sw, sh);
  const px = x2.getImageData(0, 0, sw, sh).data;
  const gris = new Uint8Array(sw * sh);
  for (let i = 0; i < gris.length; i++) gris[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
  return { blob, calidad: juzgarFoto(nitidez(gris, sw, sh), exposicion(gris)) };
}

async function subirFoto(m, slot, file) {
  try {
    const { blob, calidad } = await prepararFoto(file);
    const previas = (S.fotos.get(m.id) || []).filter(f => f.slot === slot);
    for (const f of previas) { await Almacen.borrar('fotos', f.id); S.urls.delete(f.id); }
    await Almacen.guardar('fotos', { muestra: m.id, slot, blob, calidad, ts: Date.now() });
    await cargarFotos(m.id);
    render();
    if (calidad.enfoque === 'pobre' || calidad.luz !== 'ok') toast('La foto quedó guardada, pero conviene repetirla: ' + avisoCalidad(calidad));
  } catch (e) { toast('No se pudo procesar la foto. Prueba con otra.'); }
}

function avisoCalidad(q) {
  const p = [];
  if (q.enfoque === 'pobre') p.push('parece desenfocada (si la superficie es lisa, puede ser normal)');
  if (q.enfoque === 'regular') p.push('enfoque justo');
  if (q.luz === 'oscura') p.push('poca luz');
  if (q.luz === 'quemada') p.push('zonas quemadas por exceso de luz');
  return p.join(', ') || 'enfoque y luz correctos';
}

/* ---------- Pestaña: observar ---------- */

async function sugerirConIA(m) {
  const key = S.ajustes.iaKey.trim();
  if (!key) { toast('Falta la clave de la IA en Ajustes.'); return; }
  const fs = (S.fotos.get(m.id) || []).slice(0, 4);
  if (!fs.length) { toast('Primero agrega fotos.'); return; }
  toast('Consultando a la IA…');
  try {
    const partes = [{ text: promptIA() }];
    for (const f of fs) partes.push({ inline_data: { mime_type: 'image/jpeg', data: await blobBase64(f.blob) } });
    const cuerpo = JSON.stringify({ contents: [{ parts: partes }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json' } });
    let r = await llamarIA(key, S.ajustes.iaModelo, cuerpo);
    if (r.status === 404) {
      const alterno = await modeloDisponible(key);
      if (alterno && alterno !== S.ajustes.iaModelo) {
        r = await llamarIA(key, alterno, cuerpo);
        if (r.ok) { S.ajustes.iaModelo = alterno; await guardarAjustes(); }
      }
    }
    if (!r.ok) throw new Error(await detalleError(r));
    const j = await r.json();
    const txt = j.candidates && j.candidates[0] && j.candidates[0].content.parts[0].text;
    const sugeridas = validarIA(JSON.parse(txt));
    await cambiar(m, () => {
      m.obs = m.obs.filter(o => o.src !== 'ia');
      for (const s of sugeridas) if (!m.obs.some(o => o.k === s.k && o.v === s.v)) m.obs.push(s);
    });
    toast(sugeridas.length ? 'La IA sugirió ' + sugeridas.length + ' características. Confírmalas tocándolas.' : 'La IA no encontró características claras.');
  } catch (e) { toast('No se pudo usar la IA: ' + e.message); }
}

const URL_IA = 'https://generativelanguage.googleapis.com/v1beta/';

function llamarIA(key, modelo, cuerpo) {
  return fetch(URL_IA + 'models/' + encodeURIComponent(modelo) + ':generateContent', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: cuerpo
  });
}

async function detalleError(r) {
  let msg = '';
  try { const j = await r.json(); msg = j.error && j.error.message ? j.error.message : ''; } catch (e) { msg = ''; }
  return 'código ' + r.status + (msg ? ' — ' + msg.slice(0, 160) : '');
}

/* Primer modelo "flash" de la cuenta que admite generateContent; null si no hay. */
async function modeloDisponible(key) {
  const r = await fetch(URL_IA + 'models?pageSize=200', { headers: { 'x-goog-api-key': key } });
  if (!r.ok) return null;
  const j = await r.json();
  const aptos = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /flash/.test(m.name) && !/(lite|image|tts|live|thinking|exp|preview)/.test(m.name));
  return aptos.length ? aptos[aptos.length - 1].name.replace(/^models\//, '') : null;
}

function blobBase64(blob) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => ko(r.error); r.readAsDataURL(blob); });
}

function calculadoraDensidad(alUsar) {
  const campo = (id, rotulo, ph) => h('label', { class: 'campo' }, h('span', {}, rotulo), h('input', { id, type: 'number', inputmode: 'decimal', step: 'any', min: '0', placeholder: ph }));
  const salida = h('div', { class: 'resultado', 'aria-live': 'polite' });
  let metodo = 'sum';
  const bloque = h('div', { class: 'calc' });
  function pintar() {
    bloque.replaceChildren(
      h('div', { class: 'chips fila' },
        chip('Sumergida (recomendada)', metodo === 'sum', () => { metodo = 'sum'; salida.replaceChildren(); pintar(); }),
        chip('Desplazamiento en probeta', metodo === 'des', () => { metodo = 'des'; salida.replaceChildren(); pintar(); })),
      metodo === 'sum'
        ? h('div', { class: 'campos' }, campo('d-aire', 'Peso en aire (g)', 'p. ej. 52,4'), campo('d-sum', 'Lectura sumergida (g)', 'p. ej. 19,8'), campo('d-res', 'Resolución báscula (g)', '0,01'))
        : h('div', { class: 'campos' }, campo('d-masa', 'Peso (g)', 'p. ej. 52,4'), campo('d-v1', 'Volumen inicial (mL)', '100'), campo('d-v2', 'Volumen final (mL)', '119'), campo('d-resv', 'Resolución probeta (mL)', '1')),
      h('button', { class: 'btn', type: 'button', on: { click: resolver } }, 'Calcular'));
  }
  function leer(id) { const v = parseFloat(String(document.getElementById(id).value).replace(',', '.')); return Number.isFinite(v) ? v : NaN; }
  function resolver() {
    const r = metodo === 'sum' ? densidadSumergida(leer('d-aire'), leer('d-sum'), isNaN(leer('d-res')) ? 0.01 : leer('d-res')) : densidadDesplazamiento(leer('d-masa'), leer('d-v1'), leer('d-v2'), isNaN(leer('d-resv')) ? 1 : leer('d-resv'));
    if (!r) { salida.replaceChildren(h('p', { class: 'aviso' }, 'Revisa los valores: el peso sumergido debe ser menor que el peso en aire, y el volumen final mayor que el inicial.')); return; }
    const ancho = (r.hi - r.lo) / r.valor;
    const etiqueta = 'Densidad ' + num(r.valor, 2) + ' g/cm³ (rango ' + num(r.lo, 2) + '–' + num(r.hi, 2) + ')';
    salida.replaceChildren(...[h('p', {}, h('b', { class: 'big' }, num(r.valor, 2)), ' g/cm³ ', h('span', { class: 'mut' }, 'rango ' + num(r.lo, 2) + ' a ' + num(r.hi, 2))),
      ancho > 0.2 ? h('p', { class: 'aviso' }, 'La incertidumbre es alta (±' + Math.round(ancho * 50) + ' %). Una muestra más grande o una báscula más fina mejoran el resultado.') : null,
      alUsar ? h('button', { class: 'btn pri', type: 'button', on: { click: () => alUsar([Math.max(0, r.lo), r.hi], etiqueta) } }, 'Usar este valor') : null].filter(Boolean));
  }
  pintar();
  return h('div', {}, bloque, salida);
}

function controlPrueba(m, s) {
  const k = s.k;
  const reg = (v, e) => registrar(m, k, v, e);
  if (k === 'mag') return h('div', { class: 'opciones' }, s.salidas.map(o => botonSalida(o, VOC.mag[o.v], () => reg(o.v))));
  if (k === 'raya') return h('div', { class: 'opciones' }, s.salidas.map(o => botonSalida(o, VOC.raya[o.v], () => reg(o.v))));
  if (k === 'fizz') return h('div', { class: 'opciones' }, s.salidas.map(o => botonSalida(o, VOC.fizz[o.v], () => reg(o.v))));
  if (k === 'mal') return h('div', { class: 'opciones' }, s.salidas.map(o => botonSalida(o, VOC.mal[o.v], () => reg(o.v))));
  if (k === 'dureza') return h('div', { class: 'opciones col' }, s.salidas.map(o => botonSalida(o, o.etiqueta, () => reg(o.v, 'Dureza entre ' + rangoTxt(o.v) + ' (' + o.etiqueta.toLowerCase() + ')'))));
  if (k === 'densidad') return calculadoraDensidad((rango, etiqueta) => reg(rango, etiqueta));
  return h('div', { class: 'chips' }, s.salidas.map(o => chip(VOC[k][o.v], false, () => alternarObs(m, k, o.v))));
}

function vistaPruebas() {

    seccion('Guías', guias.map(([k, t]) => h('details', { class: 'plegable' }, h('summary', {}, t), h('p', { class: 'ayuda' }, INSTRUCCIONES[k])))
      .concat([h('details', { class: 'plegable' }, h('summary', {}, 'Luz ultravioleta'), h('p', { class: 'ayuda' }, 'La luz UV de 365 nm daña los ojos: usa gafas con filtro UV y nunca mires la lámpara. Por ahora puedes anotar el color de fluorescencia en la ficha; todavía no entra en el cálculo.'))])),
    seccion('Calculadora de densidad', calculadoraDensidad(null)),
    seccion('Base de minerales', h('p', { class: 'ayuda' }, SIN_VERIFICAR), buscar, res));
}

const SIN_VERIFICAR = 'Valores de referencia compilados por Claude a partir de conocimiento mineralógico general. Falta contrastarlos con RRUFF, USGS o Mindat; trátalos como orientativos.';

/* ---------- Ajustes y respaldo ---------- */

async function exportar() {
  const incluir = S.ajustes.exportarUbicaciones;
  const salida = { version: 1, exportado: new Date().toISOString(), muestras: [] };
  for (const m of S.muestras) {
    const c = JSON.parse(JSON.stringify(m));
    if (m.ubic.privada && !incluir) c.ubic = { texto: '', lat: null, lng: null, privada: true };
    c.fotos = [];
    for (const f of await Almacen.fotosDe(m.id)) c.fotos.push({ slot: f.slot, calidad: f.calidad, ts: f.ts, datos: await blobBase64(f.blob) });
    salida.muestras.push(c);
  }
  const blob = new Blob([JSON.stringify(salida)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'hallazgos-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.append(a); a.click(); a.remove();
  S.ajustes.ultimoRespaldo = Date.now();
  await guardarAjustes();
  toast('Respaldo generado. Si no se descargó, tu navegador lo bloqueó.');
  render();
}

function base64Blob(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: 'image/jpeg' });
}

async function importar(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.muestras)) throw new Error('formato');
    for (const c of j.muestras) {
      const fotos = c.fotos || [];
      const m = Object.assign({}, c);
      delete m.fotos; delete m.id;
      S.ajustes.contador = Math.max(S.ajustes.contador, m.num || 0);
      await guardarMuestra(m);
      S.muestras.push(m);
      for (const f of fotos) await Almacen.guardar('fotos', { muestra: m.id, slot: f.slot, calidad: f.calidad, ts: f.ts, blob: base64Blob(f.datos) });
      await cargarFotos(m.id);
    }
    S.muestras.sort((a, b) => b.creado - a.creado);
    await guardarAjustes();
    toast('Se importaron ' + j.muestras.length + ' hallazgos.');
    render();
  } catch (e) { toast('El archivo no es un respaldo válido.'); }
}

function vistaAjustes() {
  const r = resumenAciertos(S.muestras);
  const inFile = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, on: { change: e => { if (e.target.files[0]) importar(e.target.files[0]); } } });
  const key = h('input', { class: 'ctl', id: 'ia-key', type: 'password', autocomplete: 'off', placeholder: 'Clave de la API (opcional)', value: S.ajustes.iaKey });
  const mod = h('input', { class: 'ctl', id: 'ia-modelo', type: 'text', value: S.ajustes.iaModelo });
  const dias = S.ajustes.ultimoRespaldo ? Math.floor((Date.now() - S.ajustes.ultimoRespaldo) / 86400000) : null;
  return h('div', {},
    seccion('Apariencia', h('div', { class: 'chips' }, [['auto', 'Automática'], ['light', 'Clara'], ['dark', 'Oscura']].map(([k, t]) => chip(t, S.ajustes.tema === k, async () => { S.ajustes.tema = k; await guardarAjustes(); aplicarTema(); render(); })))),
    seccion('Mis aciertos', r.total
      ? h('div', {}, h('p', {}, 'De ' + r.total + ' identificaciones cerradas, la app acertó con su primera opción en ' + r.top1 + ' y la tenía entre las tres primeras en ' + r.top3 + '.'),
        r.errores.length ? h('ul', { class: 'reg' }, r.errores.map(m => h('li', {}, h('span', {}, codigo(m) + ': la app proponía ' + (porId(m.idIA.top) ? porId(m.idIA.top).n : m.idIA.top) + ' y era ' + m.idFinal.nombre + '.')))) : null)
      : h('p', { class: 'mut' }, 'Aún no hay identificaciones cerradas. Guarda la identificación final en la Ficha de cada hallazgo para ir midiendo los aciertos y formar tu propio conjunto de datos.')),
    seccion('Datos en este teléfono',
      h('p', {}, Almacen.enMemoria ? 'Este navegador no permite guardar datos: lo que registres se perderá al cerrar la página.' : 'Los hallazgos y las fotos se guardan solo en este dispositivo.'),
      h('p', { class: dias === null || dias > 30 ? 'aviso' : 'mut' }, dias === null ? 'Aún no hay respaldo. Si borras los datos del navegador, se pierde todo.' : 'Último respaldo hace ' + dias + (dias === 1 ? ' día.' : ' días.')),
      chip('Incluir ubicaciones privadas en el respaldo', S.ajustes.exportarUbicaciones, async () => { S.ajustes.exportarUbicaciones = !S.ajustes.exportarUbicaciones; await guardarAjustes(); render(); }),
      h('div', { class: 'acciones' }, h('button', { class: 'btn', type: 'button', on: { click: exportar } }, 'Exportar respaldo'), h('button', { class: 'btn', type: 'button', on: { click: () => inFile.click() } }, 'Importar respaldo'), inFile)),
    seccion('Descripción por IA (opcional)', h('p', { class: 'ayuda' }, 'Sin esto la app funciona completa. Si activas una clave del plan gratuito de Google AI Studio, las fotos se envían a Google para que proponga características visibles. Los límites y condiciones del plan gratuito los define Google y pueden cambiar; revísalos antes de usarlo.'),
      h('label', { class: 'campo' }, h('span', {}, 'Clave'), key), h('label', { class: 'campo' }, h('span', {}, 'Modelo'), mod),
      h('button', { class: 'btn', type: 'button', on: { click: async () => { S.ajustes.iaKey = key.value.trim(); S.ajustes.iaModelo = mod.value.trim() || 'gemini-2.5-flash'; await guardarAjustes(); toast('Guardado.'); render(); } } }, 'Guardar')),
    seccion('Acerca de', h('p', {}, SIN_VERIFICAR), h('p', { class: 'mut' }, 'La app propone hipótesis, no identificaciones. No estima precios. La fluorescencia, las asociaciones minerales y la distribución geográfica aún no forman parte de la base.')),
    seccion('Borrar todo', borrarTodo()));
}

function borrarTodo() {
  const caja = h('div', {});
  const base = () => caja.replaceChildren(h('button', { class: 'btn peligro', type: 'button', on: { click: () => caja.replaceChildren(h('p', {}, 'Se borrarán todos los hallazgos, fotos y ajustes de este teléfono.'), h('div', { class: 'acciones' }, h('button', { class: 'btn peligro', type: 'button', on: { click: async () => { await Almacen.vaciar(); S.muestras = []; S.fotos.clear(); S.ajustes = JSON.parse(JSON.stringify(AJUSTES_BASE)); aplicarTema(); ir('hallazgos'); } } }, 'Sí, borrar todo'), h('button', { class: 'btn', type: 'button', on: { click: base } }, 'Cancelar'))) } }, 'Borrar todos los datos'));
  base();
  return caja;
}

/* ---------- Estructura general ---------- */

const ICONOS = {
  hallazgos: 'M4 16l3-8 6-3 6 5-2 8H8z',
  nueva: 'M11 4a7 7 0 100 14 7 7 0 000-14zM16 16l5 5',
  pruebas: 'M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3M8 14h8',
  favoritos: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'
};

function icono(d) { return h('svg', { viewBox: '0 0 24 24', width: 22, height: 22, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, h('path', { d })); }

function titulo(r) {
  const p = parseRuta(r);
  if (p) return 'Hallazgo';
  return { hallazgos: 'Mis hallazgos', nueva: 'Analizar muestra', pruebas: 'Pruebas', favoritos: 'Favoritos', ajustes: 'Ajustes' }[r] || 'Rocas';
}

function render() {
  const raiz = document.getElementById('app');
  const y = window.scrollY;
  const p = parseRuta(S.ruta);
  let vista;
  if (p) vista = vistaMuestra(p.id, p.tab);
  else vista = { hallazgos: vistaHallazgos, nueva: vistaNueva, pruebas: vistaPruebas, favoritos: vistaFavoritos, ajustes: vistaAjustes }[S.ruta]();
  const activa = p ? 'hallazgos' : S.ruta;
  const nav = [['hallazgos', 'Hallazgos'], ['nueva', 'Analizar'], ['pruebas', 'Pruebas'], ['favoritos', 'Favoritos']];
  raiz.replaceChildren(
    h('header', { class: 'bar' },
      p ? h('button', { class: 'ib', type: 'button', 'aria-label': 'Volver', on: { click: () => ir('hallazgos') } }, '‹') : null,
      h('h1', {}, titulo(S.ruta)),
      h('button', { class: 'ib', type: 'button', 'aria-label': 'Ajustes', on: { click: () => ir('ajustes') } }, '⚙')),
    h('main', { class: 'vista' }, vista),
    h('nav', { class: 'tabs', 'aria-label': 'Secciones' }, nav.map(([k, t]) => h('button', { type: 'button', class: k === activa ? 'on' : '', 'aria-current': k === activa ? 'page' : null, on: { click: () => ir(k) } }, icono(ICONOS[k]), h('span', {}, t)))),
    h('div', { id: 'toast', class: 'toast', role: 'status', hidden: true }));
  window.scrollTo(0, y);
  pintarToast();
}

async function iniciar() {
  await Almacen.abrir();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
  const aj = await Almacen.leer('meta', 'ajustes');
  if (aj) S.ajustes = Object.assign(JSON.parse(JSON.stringify(AJUSTES_BASE)), aj.v, { kit: Object.assign({}, AJUSTES_BASE.kit, aj.v.kit) });
  S.muestras = (await Almacen.listar('muestras')).sort((a, b) => b.creado - a.creado);
  for (const m of S.muestras) await cargarFotos(m.id);
  aplicarTema();
  S.ruta = leerRuta() || 'hallazgos';
  window.addEventListener('popstate', () => { S.ruta = leerRuta() || 'hallazgos'; render(); });
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { /* sin soporte en este contexto */ });
}

iniciar().catch(e => { document.getElementById("app").textContent = "No se pudo iniciar: " + e.message; });
</script>
